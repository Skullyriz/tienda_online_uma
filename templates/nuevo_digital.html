{% extends "base.html" %}

{% block titulo %}Nuevo producto digital{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h1 class="mb-4">
                    💻 Nuevo producto digital
                </h1>

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Código
                        </label>

                        <input
                            type="text"
                            name="codigo"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            name="nombre"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Precio base
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="precio_base"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Stock
                            </label>

                            <input
                                type="number"
                                name="stock"
                                class="form-control"
                                min="0"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Licencia
                        </label>

                        <input
                            type="text"
                            name="licencia"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Imagen del producto
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            name="imagen"
                            accept="image/png,image/jpeg,image/gif,image/webp"
                        >

                        <div class="form-text">
                            PNG, JPG, JPEG, GIF o WEBP. Máximo 5 MB.
                        </div>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Crear producto
                        </button>

                        <a
                            href="{{ url_for('inicio') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
