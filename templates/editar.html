{% extends "base.html" %}

{% block titulo %}Editar producto{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h1 class="mb-4">
                    ✏️ Editar producto
                </h1>

                {% if producto.imagen %}

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='uploads/' + producto.imagen) }}"
                        alt="{{ producto.nombre }}"
                        class="img-fluid rounded shadow-sm"
                        style="max-height: 250px;"
                    >

                </div>

                {% endif %}

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Código
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ producto.codigo }}"
                            disabled
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            name="nombre"
                            class="form-control"
                            value="{{ producto.nombre }}"
                            required
                        >

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Precio base
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="precio_base"
                                class="form-control"
                                value="{{ producto.precio_base }}"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Stock
                            </label>

                            <input
                                type="number"
                                name="stock"
                                class="form-control"
                                min="0"
                                value="{{ producto.stock }}"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Cambiar imagen
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            name="imagen"
                            accept="image/png,image/jpeg,image/gif,image/webp"
                        >

                        <div class="form-text">
                            Déjalo vacío para conservar la imagen actual.
                            PNG, JPG, JPEG, GIF o WEBP. Máximo 5 MB.
                        </div>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Guardar cambios
                        </button>

                        <a
                            href="{{ url_for('detalle_producto', producto_id=producto.id) }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
